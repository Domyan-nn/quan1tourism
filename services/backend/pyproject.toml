[project]
name = "quan1-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.22,<1",
  "pwdlib[argon2]>=0.3,<1", "pillow>=13.0.0,<14", "mutagen>=1.47,<2"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
