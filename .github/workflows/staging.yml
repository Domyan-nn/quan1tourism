name: Deploy staging
on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  provenance:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: gate
        run: python scripts/release_control.py gate-ci --run-id "$SOURCE_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  deploy:
    needs: provenance
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      release_sha: ${{ needs.provenance.outputs.sha }}
      ci_run_id: ${{ needs.provenance.outputs.ci_run_id }}
    secrets: inherit
